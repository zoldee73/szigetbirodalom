<!doctype html><html lang="hu"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Szigetjáték</title><style>body{margin:0;background:#112c31;color:#f4f1de;font:16px system-ui}main{max-width:900px;margin:auto;padding:14px}h1{margin:8px 0;color:#f3c777}.panel{background:#1d4247;border-radius:14px;padding:14px;margin:10px 0}button,input,select{font:inherit;border:0;border-radius:9px;padding:10px;margin:3px}button{background:#efbc68;color:#172e33;font-weight:700}button:disabled{opacity:.35}input,select{max-width:95%}svg{width:100%;background:#35798c;border-radius:14px;touch-action:manipulation}.tile{stroke:#21434a;stroke-width:.06}.vertex{cursor:pointer}.edge{cursor:pointer}.muted{color:#c5d3d2}#error{color:#ffc0aa}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{background:#326066;border-radius:8px;padding:8px}#game{display:none}small{display:block}</style><main><h1>🏝️ Szigetjáték</h1><div class="panel" id="lobby"><p>Privát szigetépítő stratégiai játék – fejlesztés alatt, 2–4 játékos.</p><input id="name" placeholder="Neved" value="Játékos"><select id="mode"><option value="classic">Klasszikus szabálymód</option><option value="classic2">Klasszikus szabályok két játékossal</option><option value="duo">Kétjátékos szabálymód (fejlesztés alatt)</option></select><p><button onclick="join('')">Új szoba</button></p><input id="code" placeholder="Meghívókód"><button onclick="join(document.getElementById('code').value)">Csatlakozás</button><p id="error"></p></div><div id="game"><div class="panel"><b id="room"></b><p id="status"></p><button id="copy" onclick="navigator.clipboard.writeText(location.origin+'/?room='+state.code).then(()=>alert('Meghívólink másolva'))">Meghívólink másolása</button><button onclick="shareInvite()">📨 Meghívás Messengeren</button><button id="start" onclick="act('start')">Játék indítása</button></div><svg id="map" viewBox="-5.6 -5.2 11.2 10.4"></svg><div class="panel"><div id="players"></div><div class="chips" id="resources"></div><p id="instructions"></p><button onclick="act('roll')">🎲 Dobás</button><button onclick="setTool('village')">🏠 Település</button><button onclick="setTool('road')">🛤️ Út</button><button onclick="setTool('city')">🏰 Város</button><button onclick="act('end')">Kör vége</button><p><button onclick="act('buydev')">🃏 Fejlesztéskártya vásárlása (gabona + gyapjú + érc)</button></p><div id="devcards"></div><div id="robbercontrols" class="panel" style="display:none"><b>🦹 Rabló</b><p id="robbertext"></p><div id="discardinputs" class="chips"></div><button id="discardbutton" onclick="submitDiscard()">Lapok eldobása</button><p class="muted">Rabló mozgatásához érintsd meg az új mezőt a térképen. Ha van ellenfél a mező mellett, add meg a játékos sorszámát.</p><input id="victim" type="number" min="0" max="3" placeholder="Játékos sorszáma"></div><p><select id="give"><option value="wood">Fa</option><option value="brick">Tégla</option><option value="wheat">Gabona</option><option value="sheep">Gyapjú</option><option value="ore">Érc</option></select> ➜ <select id="get"><option value="brick">Tégla</option><option value="wood">Fa</option><option value="wheat">Gabona</option><option value="sheep">Gyapjú</option><option value="ore">Érc</option></select><button onclick="act('trade',{give:document.getElementById('give').value,get:document.getElementById('get').value})">Banki / kikötői csere</button></p><div class="panel"><b>🤝 Csere másik játékossal</b><p>Játékos sorszáma: <input id="tradeTo" type="number" min="0" max="3" value="1" style="width:60px"></p><p>Adok: <select id="offerType"><option value="wood">Fa</option><option value="brick">Tégla</option><option value="wheat">Gabona</option><option value="sheep">Gyapjú</option><option value="ore">Érc</option></select><input id="offerN" type="number" min="1" value="1" style="width:60px"></p><p>Kérek: <select id="wantType"><option value="brick">Tégla</option><option value="wood">Fa</option><option value="wheat">Gabona</option><option value="sheep">Gyapjú</option><option value="ore">Érc</option></select><input id="wantN" type="number" min="1" value="1" style="width:60px"></p><button onclick="offerTrade()">Csere felajánlása</button><div id="tradePending"></div></div><small id="log"></small><p id="gameerror"></p></div></div></main><script>
let ws,state,tool='village';function shareInvite(){let url=location.origin+'/?room='+state.code;if(navigator.share)navigator.share({title:'Szigetjáték meghívó',text:'Csatlakozz a privát játékunkhoz!',url}).catch(()=>{});else navigator.clipboard?.writeText(url).then(()=>alert('Meghívólink másolva: illeszd be a Messenger-beszélgetésbe.')).catch(()=>prompt('Másold a linket Messengerbe:',url))}function submitDiscard(){let resources={};document.querySelectorAll('[data-discard]').forEach(e=>resources[e.dataset.discard]=Number(e.value)||0);act('discard',{resources})}const names={wood:'🌲 Fa',brick:'🧱 Tégla',wheat:'🌾 Gabona',sheep:'🐑 Gyapjú',ore:'⛰️ Érc',desert:'🏜️ Sivatag'},colors={wood:'#41835a',brick:'#c36c52',wheat:'#e1bc5e',sheep:'#91b971',ore:'#85959d',desert:'#d7bd83'};
function join(code){if(ws&&[0,1].includes(ws.readyState))return;ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host);ws.onopen=()=>ws.send(JSON.stringify({type:'join',code,name:document.getElementById('name').value,mode:document.getElementById('mode').value,token:localStorage.getItem('sziget-token-'+code)}));ws.onmessage=e=>{let msg=JSON.parse(e.data);if(msg.type==='error'){document.getElementById(state?'gameerror':'error').textContent=msg.message;return}state=msg.state;localStorage.setItem('sziget-token-'+state.code,state.token);document.getElementById('lobby').style.display='none';document.getElementById('game').style.display='block';history.replaceState(null,'','?room='+state.code);render()};ws.onclose=()=>{document.getElementById(state?'gameerror':'error').textContent='Kapcsolat megszakadt. Frissítsd az oldalt a visszacsatlakozáshoz.'}}
function offerTrade(){const give={[document.getElementById('offerType').value]:Number(document.getElementById('offerN').value)},want={[document.getElementById('wantType').value]:Number(document.getElementById('wantN').value)};act('offertrade',{to:Number(document.getElementById('tradeTo').value),give,want})}
function playCard(card){let extra={card};if(card==='yearofplenty'){let a=prompt('Első nyersanyag: wood, brick, wheat, sheep, ore');let b=prompt('Második nyersanyag: wood, brick, wheat, sheep, ore');if(!a||!b)return;extra.picks=[a,b]}if(card==='monopoly'){let t=prompt('Melyik nyersanyag? wood, brick, wheat, sheep, ore');if(!t)return;extra.resource=t}act('playdev',extra)}
function act(action,extra={}){if(ws?.readyState===1)ws.send(JSON.stringify({type:'action',action,...extra}))}
function setTool(t){tool=t;document.getElementById('instructions').textContent='Kiválasztva: '+({village:'település – érintsd meg a csomópontot',road:'út – érintsd meg az él közepét',city:'város – érintsd meg saját településed'}[t])}
const el=(tag,attrs={},text='')=>{let e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(let [k,v] of Object.entries(attrs))e.setAttribute(k,v);e.textContent=text;return e};
function render(){let s=state,me=s.players.find(p=>p.id===s.you),order=[...s.players.map((_,i)=>i),...s.players.map((_,i)=>i).reverse()],turn=s.phase==='setup'?order[s.setupIndex]:s.turn;document.getElementById('room').textContent='Szoba: '+s.code+' · '+s.mode;document.getElementById('status').textContent=s.winner!==null?'🏆 Győztes: '+s.players.find(p=>p.id===s.winner).name:s.phase==='lobby'?'Várakozás második játékosra':s.phase==='setup'?'Kezdő építés: '+s.players[turn].name:s.players[turn].name+' következik · Dobás: '+(s.roll??'–');document.getElementById('start').style.display=s.phase==='lobby'&&s.you===0?'inline-block':'none';document.getElementById('start').disabled=s.players.length<2;document.getElementById('players').textContent=s.players.map(p=>p.name+' ('+p.resourceCount+' lap)').join('  •  ');document.getElementById('resources').innerHTML=Object.entries(me.resources).map(([t,n])=>'<span class="chip">'+names[t]+': '+n+'</span>').join('');document.getElementById('log').textContent=s.log.join(' | ');document.getElementById('players').textContent=s.players.map(p=>p.name+' · '+p.score+' pont · '+p.resourceCount+' lap · '+p.knights+' lovag').join(' | ');document.getElementById('devcards').innerHTML=(me.dev||[]).map(d=>'<button '+(d.type==='victory'?'disabled':'')+' onclick="playCard(\''+d.type+'\')">'+({knight:'Lovag',roadbuilding:'Útépítés',yearofplenty:'Találmány',monopoly:'Monopólium',victory:'Győzelmi pont'})[d.type]+'</button>').join('');let tr=s.pendingTrade, tradeBox=document.getElementById('tradePending');tradeBox.replaceChildren();if(tr){let desc=document.createElement('p');desc.textContent=s.players[tr.from].name+' ajánlata: '+JSON.stringify(tr.give)+' → '+JSON.stringify(tr.want);tradeBox.append(desc);if(tr.to===s.you){for(const [label,action] of [['Elfogadom','accepttrade'],['Elutasítom','rejecttrade']]){let b=document.createElement('button');b.textContent=label;b.onclick=()=>act(action);tradeBox.append(b)}}else if(tr.from===s.you){let b=document.createElement('button');b.textContent='Ajánlat visszavonása';b.onclick=()=>act('canceltrade');tradeBox.append(b)}}let rc=document.getElementById('robbercontrols');rc.style.display=s.robberPhase?'block':'none';document.getElementById('robbertext').textContent=s.robberPhase==='discard'?'Dobás: 7. Eldobandó lapok: '+(s.discardNeeded[s.you]||0):s.robberPhase==='move'?'A soron lévő játékos helyezze át a rablót.':'';document.getElementById('discardinputs').innerHTML=s.robberPhase==='discard'&&s.discardNeeded[s.you]?Object.keys(me.resources).map(t=>'<label>'+names[t]+' <input data-discard="'+t+'" type="number" min="0" max="'+me.resources[t]+'" value="0" style="width:52px"></label>').join(''):'';document.getElementById('discardbutton').style.display=s.robberPhase==='discard'&&s.discardNeeded[s.you]?'inline-block':'none';
let svg=document.getElementById('map');svg.replaceChildren();for(let i=0;i<s.tiles.length;i++){let t=s.tiles[i],cx=Math.sqrt(3)*(t.q+t.r/2),cy=1.5*t.r,pts=Array.from({length:6},(_,k)=>{let a=Math.PI/180*(60*k-30);return (cx+Math.cos(a))+','+(cy+Math.sin(a))}).join(' ');let poly=el('polygon',{points:pts,fill:colors[t.type],class:'tile'});poly.addEventListener('click',()=>{if(s.robberPhase==='move')act('robber',{id:i,victim:document.getElementById('victim').value})});svg.append(poly);svg.append(el('text',{x:cx,y:cy-.15,'font-size':'.45','text-anchor':'middle'},names[t.type].split(' ')[0]));if(i===s.robber)svg.append(el('text',{x:cx,y:cy+.78,'font-size':'.45','text-anchor':'middle'},'🦹'));if(t.num)svg.append(el('text',{x:cx,y:cy+.36,'font-size':'.4','font-weight':'bold','text-anchor':'middle',fill:'#172e33'},String(t.num)))}for(let edge of s.edges){let a=s.vertices[edge.a],b=s.vertices[edge.b],owner=s.roads[edge.id];if(owner!==undefined)svg.append(el('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:owner===0?'#fef5e2':'#273a8a','stroke-width':'.16','stroke-linecap':'round'}));let hit=el('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:'transparent','stroke-width':'.32',class:'edge'});hit.addEventListener('click',()=>{if(tool==='road')act('road',{id:edge.id})});svg.append(hit)}for(let v of s.vertices){let b=s.buildings[v.id];if(b)svg.append(el('circle',{cx:v.x,cy:v.y,r:b.level===2?'.22':'.15',fill:b.owner===0?'#fff4ce':'#343eac',stroke:'#132c30','stroke-width':'.05'}));let hit=el('circle',{cx:v.x,cy:v.y,r:'.20',fill:b?'transparent':'#ffffff','fill-opacity':b?0:.14,class:'vertex'});hit.addEventListener('click',()=>{if(tool!=='road')act(tool,{id:v.id})});svg.append(hit)}document.getElementById('instructions').textContent=s.phase==='setup'?'Kezdő kör: előbb település, majd a hozzá kapcsolódó út.': 'Válassz építményt, majd érintsd meg a tábla megfelelő pontját.'}
if(new URLSearchParams(location.search).get('room')){let room=new URLSearchParams(location.search).get('room');document.getElementById('code').value=room;if(localStorage.getItem('sziget-token-'+room))join(room)}
</script></html>
